<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slim City ticket 14 prototype, round 1 (throwaway)</title>
<style>
:root{--bg:#3B9C74;--cell:#4EB583;--panel:#1f2a33;--ink:#f3f5f7;--mute:#9fb0bd;--accent:#ffd24a;--bad:#ff5a5a;--ok:#6fe39a;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#111;font:14px system-ui;color:var(--ink);display:flex;justify-content:center}
#app{position:relative;width:390px;height:780px;background:var(--bg);overflow:hidden;margin:10px;border-radius:28px;box-shadow:0 0 0 8px #000}
#hdr{position:absolute;top:0;left:0;right:0;padding:34px 8px 8px;display:flex;gap:6px;background:linear-gradient(#0008,#0000);z-index:5}
.res{position:relative;flex:1;background:var(--panel);border-radius:10px;padding:5px 6px;text-align:center;cursor:pointer;font-weight:600}
.res small{display:block;color:var(--mute);font-weight:400;font-size:10px}
.res.cap b{color:var(--accent)} .res.neg b{color:var(--bad)}
#sync{width:34px;background:var(--panel);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.45}
#sync.fresh{opacity:1;font-weight:900}
.pop{position:absolute;top:100%;left:0;margin-top:6px;width:200px;background:var(--panel);border:1px solid #fff3;border-radius:12px;padding:10px;text-align:left;font-weight:400;z-index:20;box-shadow:0 8px 20px #0008}
.bar{height:8px;background:#0006;border-radius:4px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ok)}
#city{position:absolute;inset:100px 10px 110px;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:2px}
.c{background:var(--cell);border-radius:3px;position:relative}
.c.g{background:#4ee08a}.c.r{background:#ff6b6b}
.b{position:relative;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid #0004;z-index:2;cursor:pointer}
.b.scaf{opacity:.65;border-style:dashed}.b.sel{outline:3px solid var(--accent)}
.badges{position:absolute;top:-10px;right:-6px;display:flex;gap:2px;z-index:6}
.badge{background:var(--panel);border:1px solid #fff5;border-radius:10px;font-size:11px;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.badge.bang{background:var(--accent);color:#000;font-weight:900;animation:p 1s infinite alternate}
@keyframes p{to{transform:scale(1.2)}}
.rings{position:absolute;left:2px;bottom:2px;display:flex;gap:2px}
.ring{width:14px;height:14px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#0006 0)}
#ftr{position:absolute;bottom:0;left:0;right:0;height:100px;padding:10px;display:flex;gap:10px;justify-content:center;align-items:flex-start;background:linear-gradient(#0000,#000a);z-index:5}
.btn{background:var(--panel);color:var(--ink);border:0;border-radius:var(--r);padding:12px 22px;font:600 15px system-ui;cursor:pointer}
.btn.on{background:var(--accent);color:#000}.btn.p{background:var(--ok);color:#000}.btn.d{background:#7a2b2b}
#dbg{position:absolute;right:10px;bottom:70px;width:34px;height:34px;border-radius:50%;background:#7a2b2b;border:0;color:#fff;z-index:6}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-radius:20px 20px 0 0;padding:14px;z-index:30;transform:translateY(105%);transition:transform .25s;max-height:62%;overflow:auto}
.sheet.open{transform:none}
.carousel{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.card{flex:0 0 118px;background:#0004;border-radius:12px;padding:8px;font-size:12px;position:relative;cursor:pointer}
.card.lock{opacity:.5}.card .ic{font-size:26px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}.row .bar{flex:1;margin:0}
.pm{width:28px;height:28px;border-radius:50%;border:0;background:#fff2;color:var(--ink);font-size:18px}
#modal{position:absolute;inset:0;background:#000a;z-index:50;display:none;align-items:center;justify-content:center}
#modal>div{background:var(--panel);border-radius:18px;padding:18px;width:300px}
#dlg{position:absolute;left:10px;right:10px;bottom:120px;background:var(--panel);border-radius:14px;padding:12px;z-index:40;display:none;gap:10px}
#tools{position:absolute;top:100px;left:10px;z-index:8;display:flex;flex-direction:column;gap:4px}
#tools button{font-size:10px;padding:3px 6px;border-radius:6px;border:0;background:#000a;color:#fff}
.hint{position:absolute;left:0;right:0;top:92px;text-align:center;z-index:7;font-size:12px;text-shadow:0 1px 3px #000}
h3{margin:0 0 8px}
</style></head><body><div id="app">
<div id="hdr"></div><div class="hint" id="hint"></div>
<div id="tools">
 <button onclick="T.edit=!T.edit;render()">toggle: Edit in sheet</button>
 <button onclick="T.foot=!T.foot;render()">toggle: footer Edit</button>
 <button onclick="showModal('welcome')">modal: collected</button>
 <button onclick="showModal('ledger')">modal: day ledger</button>
 <button onclick="toast('+12 food')">minimal +12</button>
 <button onclick="dlg()">dialog box</button>
 <button onclick="drawer()">bottom drawer</button>
 <button onclick="S.food=S.food>0?0:40;render()">food 0 / 40</button>
 <button onclick="S.gcap=!S.gcap;render()">gold cap on/off</button>
</div>
<div id="city"></div>
<button id="dbg" onclick="drawer('Debug','Add resources, reset, fake feed')">D</button>
<div id="ftr"></div>
<div id="dlg"><div style="font-size:30px">🧑‍🌾</div><div style="flex:1">Welcome, mayor. Go and move your body, then come back. <div style="color:var(--mute);font-size:11px;margin-top:6px" onclick="this.parentNode.parentNode.style.display='none'">tap to continue</div></div></div>
<div class="sheet" id="sheet"></div>
<div id="modal" onclick="if(event.target===this)this.style.display='none'"><div id="mbody"></div></div>
</div>
<script>
const CAT={house:{n:'House',i:'🏠',w:2,h:2,c:{wood:50,gold:500},lv:1,eff:{wood:50,gold:50}},farm:{n:'Farm',i:'🌾',w:3,h:3,c:{wood:80,gold:300},lv:1,eff:{wood:60,gold:30,food:40}},mill:{n:'Lumber mill',i:'🪵',w:2,h:3,c:{wood:120,stone:40},lv:2,eff:{}},quarry:{n:'Quarry',i:'⛏️',w:4,h:2,c:{wood:150,stone:60},lv:2,eff:{}},board:{n:'Mission board',i:'📋',w:2,h:2,c:{wood:100},lv:3,eff:{}},market:{n:'Marketplace',i:'🏪',w:3,h:3,c:{wood:200,gold:900},lv:4,eff:{}}};
const COL={food:'#ff9a4a',wood:'#c98a4a',stone:'#aab4be',gold:'#ffd24a'},IC={food:'🍎',wood:'🪵',stone:'🪨',gold:'🪙'};
const S={food:40,wood:210,stone:30,gold:1200,people:8,max:10,hall:1,gcap:false};
const T={edit:true,foot:true};
let B=[{id:1,t:'hall',x:2,y:2,w:3,h:3,st:'open'},{id:2,t:'farm',x:0,y:5,w:3,h:3,st:'ready'},{id:3,t:'house',x:6,y:1,w:2,h:2,st:'scaf',p:{wood:100,gold:60},wk:1}];
CAT.hall={n:'Village Hall',i:'🏛️',w:3,h:3,c:{},lv:0,eff:{}};
let mode=null,place=null,sel=null,editMode=false,pop=null,id=10;
const $=s=>document.querySelector(s);
function render(){
 const hd=['food','wood','stone','gold'].map(r=>`<div class="res ${r=='food'&&S.food<=0?'neg':''} ${r=='gold'&&S.gcap?'cap':''}" onclick="popup('${r}',event)"><small>${IC[r]}</small><b>${S[r]}</b>${pop==r?popHtml(r):''}</div>`).join('');
 $('#hdr').innerHTML=hd+`<div class="res" onclick="drawer('People','Free 2 · Working 4 · Building 2 · Eats 8 food / hour')"><small>🧍</small><b>${S.people}/${S.max}</b></div><div id="sync" class="${pop=='sync'?'fresh':'fresh'}" onclick="popup('sync',event)">🏃${pop=='sync'?'<div class="pop" style="right:0;left:auto">Last synced 12 min ago</div>':''}</div>`;
 const c=$('#city');c.innerHTML='';
 for(let y=0;y<8;y++)for(let x=0;x<8;x++){const d=document.createElement('div');d.className='c';d.style.gridColumn=x+1;d.style.gridRow=y+1;d.onclick=()=>cell(x,y);d.id=`c${x}_${y}`;c.appendChild(d)}
 B.forEach(b=>{const d=document.createElement('div');d.className='b'+(b.st=='scaf'?' scaf':'')+(sel==b.id?' sel':'');d.style.cssText=`grid-column:${b.x+1}/span ${b.w};grid-row:${b.y+1}/span ${b.h};background:${b.st=='scaf'?'#8a7a5a':'#a67c52'}`;
  d.innerHTML=CAT[b.t].i+badges(b);d.onclick=e=>{e.stopPropagation();tapB(b)};c.appendChild(d)});
 if(place)prev();
 $('#ftr').innerHTML=place?`<button class="btn" onclick="rot()">⟳ Rotate</button><button class="btn p" onclick="ok()">Confirm</button><button class="btn d" onclick="place=null;render()">Cancel</button>`:
  `<button class="btn" onclick="openBuild()">🔨 Build</button>`+(T.foot?`<button class="btn ${editMode?'on':''}" onclick="editMode=!editMode;sel=null;render()">✏️ Edit</button>`:'');
 $('#hint').textContent=place?'Tap a cell to move the preview':editMode?'Edit mode: tap a building, then Move / Rotate / Delete':'';
 if(editMode&&sel)editBar();
}
function badges(b){let a=[],r='';
 if(b.st=='ready')a.push('<span class="badge bang">!</span>');
 if(b.st=='scaf'){const k=Object.keys(b.p);r='<div class="rings">'+k.map((q,i)=>`<i class="ring" style="--c:${COL[q]};--p:${b.p[q]}" title="${q}"></i>`).join('')+'</div>';if(!b.wk)a.push('<span class="badge">👷</span>')}
 if(b.t=='house'&&S.food<=0)a.push('<span class="badge">🍎</span>');
 return `<div class="badges">${a.join('')}</div>${r}`}
function popHtml(r){const g=r=='gold'&&S.gcap;return `<div class="pop"><b>${r}</b> today<div class="bar"><i style="width:${g?100:62}%"></i></div>${g?'Cap reached (150%)':'93 of 150 cap'}<br><span style="color:var(--mute)">base 100 + adds 10, x1.2</span></div>`}
function popup(r,e){e.stopPropagation();pop=pop==r?null:r;render()}
document.addEventListener('click',()=>{if(pop){pop=null;render()}});
function sheet(h){const s=$('#sheet');s.innerHTML=h;s.classList.add('open')}
function closeSheet(){$('#sheet').classList.remove('open');place=null;render()}
function openBuild(){sheet(`<h3>Build <span style="float:right" onclick="closeSheet()">✕</span></h3><div class="carousel">`+Object.entries(CAT).filter(([k])=>k!='hall').map(([k,v])=>{const l=v.lv>S.hall;return `<div class="card ${l?'lock':''}" onclick="${l?`toast('Needs Village Hall level ${v.lv}')`:`start('${k}')`}"><div class="ic">${v.i}</div><b>${v.n}</b><br>${v.w}x${v.h}<br>${Object.entries(v.c).map(([r,n])=>IC[r]+n).join(' ')}<br>effort ${Object.values(v.c).reduce((a,b)=>a+b,0)/20}u${l?`<br>🔒 Hall ${v.lv}`:''}</div>`}).join('')+`</div><div style="color:var(--mute);font-size:11px">Later: an expand button for a full grid of all buildings.</div>`)}
function start(k){closeSheet();place={t:k,w:CAT[k].w,h:CAT[k].h,x:3,y:0};render()}
function cell(x,y){if(place){place.x=Math.min(x,8-place.w);place.y=Math.min(y,8-place.h);render()}else if(sel&&editMode&&mode=='move'){}}
function bad(p,ig){return p.x<0||p.y<0||p.x+p.w>8||p.y+p.h>8||B.some(b=>b.id!=ig&&b.x<p.x+p.w&&p.x<b.x+b.w&&b.y<p.y+p.h&&p.y<b.y+b.h)}
function prev(){const e=bad(place,place.id);for(let i=0;i<place.w;i++)for(let j=0;j<place.h;j++){const c=$(`#c${place.x+i}_${place.y+j}`);if(c)c.classList.add(e?'r':'g')}}
function rot(){[place.w,place.h]=[place.h,place.w];place.x=Math.min(place.x,8-place.w);place.y=Math.min(place.y,8-place.h);render()}
function ok(){if(bad(place,place.id))return toast('Blocked');if(place.id){Object.assign(B.find(b=>b.id==place.id),{x:place.x,y:place.y,w:place.w,h:place.h})}else{const c=CAT[place.t];B.push({id:++id,t:place.t,x:place.x,y:place.y,w:place.w,h:place.h,st:'scaf',p:Object.fromEntries(Object.keys(c.c).map(k=>[k,0])),wk:0})}place=null;sel=null;render()}
function tapB(b){if(editMode){sel=b.id;return render()}sel=b.id;bsheet(b)}
function bsheet(b){const c=CAT[b.t];let body='';
 if(b.st=='scaf')body=Object.keys(b.p).map(r=>`<div class="row">${IC[r]}<div class="bar"><i style="width:${b.p[r]}%;background:${COL[r]}"></i></div>${b.p[r]}%</div>`).join('')+`<div class="row">👷 Workers <button class="pm" onclick="wk(${b.id},-1)">−</button>${b.wk}/2<button class="pm" onclick="wk(${b.id},1)">+</button></div><button class="btn d" onclick="warn(${b.id})">Cancel build</button>`;
 else if(b.st=='ready')body=`<p>Finished. Tap to cut the ribbon.</p><button class="btn p" onclick="B.find(x=>x.id==${b.id}).st='open';closeSheet();toast('Opened!')">✂️ Open building</button>`;
 else if(['board','market'].includes(b.t))body=`<p>Coming soon.</p>`;
 else body=`<div class="row">Effects: +10 ${b.t=='farm'?'food':''} · x1.1 per person</div><div class="row">👷 People <button class="pm">−</button>1/3<button class="pm">+</button></div><div class="row">Upgrade: <button class="btn" onclick="toast('Upgrade scaffold placed')">Level 2 · 🪵80 🪙200</button></div>`;
 sheet(`<h3>${c.i} ${c.n} <span style="float:right" onclick="closeSheet()">✕</span></h3>`+body+(T.edit&&b.t!='hall'||T.edit?`<div style="margin-top:8px"><button class="btn" onclick="editMode=true;closeSheet();sel=${b.id};render()">✏️ Edit this building</button></div>`:''))}
function wk(i,d){const b=B.find(x=>x.id==i);b.wk=Math.max(0,Math.min(2,b.wk+d));render();bsheet(b)}
function warn(i){sheet(`<h3>Cancel build?</h3><p>You get the resources back. The effort you filled is lost, and you must re-gather it next time.</p><button class="btn d" onclick="B=B.filter(x=>x.id!=${i});closeSheet()">Yes, cancel</button> <button class="btn" onclick="closeSheet()">Keep building</button>`)}
function editBar(){const b=B.find(x=>x.id==sel);$('#ftr').innerHTML=`<button class="btn" onclick="place={...B.find(x=>x.id==sel)};render()">Move</button><button class="btn" onclick="const b=B.find(x=>x.id==sel);place={...b};rot()">⟳ Rotate</button>${b.t!='hall'?`<button class="btn d" onclick="delb()">Delete</button>`:''}<button class="btn" onclick="editMode=false;sel=null;render()">Done</button>`}
function delb(){sheet(`<h3>Delete?</h3><p>You get every resource back, including upgrades. Effort and feature data are lost.</p><button class="btn d" onclick="B=B.filter(x=>x.id!=sel);sel=null;closeSheet()">Delete</button>`)}
function showModal(k){$('#modal').style.display='flex';$('#mbody').innerHTML=k=='welcome'?`<h3>While you were away</h3><div class="row">🍎 +34</div><div class="row">🪵 +21</div><div class="row">🪨 +8</div><div class="row">🪙 +640</div><div class="row" style="color:var(--mute)">Build bars: House +12%</div><button class="btn p" style="width:100%" onclick="$('#modal').style.display='none'">Collect</button>`:`<h3>Yesterday</h3><div class="row">Collected 🍎 100 🪵 80 🪨 40 🪙 900</div><div class="row">People ate 🍎 64</div><div class="row" style="color:var(--bad)">Food is short. One day of grace.</div><h3 style="margin-top:12px">Day before</h3><div class="row">Collected 🍎 90 🪵 0 🪨 0 🪙 400</div><div class="row">People ate 🍎 64</div><button class="btn p" style="width:100%" onclick="$('#modal').style.display='none'">OK</button>`}
function dlg(){$('#dlg').style.display='flex'}
function drawer(t,x){sheet(`<h3>${t||'Drawer'} <span style="float:right" onclick="closeSheet()">✕</span></h3><p>${x||'Catch-all for anything not planned yet. Rises to about half or two thirds of the screen.'}</p>`)}
function toast(m){const t=document.createElement('div');t.textContent=m;t.style.cssText='position:absolute;top:110px;left:50%;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:20px;z-index:99;transition:all 1.4s';$('#app').appendChild(t);setTimeout(()=>{t.style.top='80px';t.style.opacity=0},50);setTimeout(()=>t.remove(),1500)}
render();
</script></body></html>
